server {
    server_name sputifu.no www.sputifu.no;

    location / {
        proxy_pass http://127.0.0.1:4533;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sputifu.no/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sputifu.no/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.sputifu.no) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = sputifu.no) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sputifu.no www.sputifu.no;
    return 404; # managed by Certbot




}
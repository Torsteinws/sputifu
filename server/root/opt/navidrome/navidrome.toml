#       |_| Navidrome configuration file
#
# https://www.navidrome.org/docs/usage/configuration-options/


# Folder to store application data (DB, cache…)
DataFolder = "/opt/navidrome/data"

# Music library folder
MusicFolder = "/opt/navidrome/music"


# Automated backup of navidrome database (not music files)
# https://www.navidrome.org/docs/usage/admin/backup/
[Backup]
Path = "/opt/navidrome/db_backup"
Count = 365
Schedule =  "0 0 * * *"
# Every day at 12:00 AM

[Scanner]
Schedule = "*/5 * * * *"
# Every 5 minutes
